[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-inter-bridge"
version = "0.1.0"
description = "ResearchInterBridge"
requires-python = ">=3.11"
# Document ingestion (Phase 2b). Both are BSD/MIT licensed and ship wheels for
# CPython 3.11-3.13 on every CI platform, so the suite stays installable.
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # JSON API for the web frontend (ADR-012). FastAPI is a thin layer over the
    # existing services; it adds no business rule of its own.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Multipart parsing for the document upload endpoint (ADR-014). Starlette
    # needs it for `UploadFile`; without it a multipart request is rejected
    # before the service's own size/content checks can run.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# TestClient needs httpx; keeping it out of the runtime set means a deployment
# installs neither pytest nor the test client.
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
