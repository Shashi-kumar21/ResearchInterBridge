name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installed (not just pytest) because the app now has real dependencies
      # (PyMuPDF, python-docx) that the parsing tests exercise.
      - run: pip install -e . pytest
      - run: python -m pytest

  # Declared floor in pyproject.toml is >=3.11; this job proves it. The job name
  # is deliberately new so the four required check names on `main` do not change.
  test-python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installed (not just pytest) because the app now has real dependencies
      # (PyMuPDF, python-docx) that the parsing tests exercise.
      - run: pip install -e . pytest
      - run: python -m pytest
