name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The `test` extra adds httpx, which fastapi's TestClient needs. The app
      # itself is installed because parsing tests import PyMuPDF/python-docx.
      - run: pip install -e ".[test]"
      - run: python -m pytest

  # Declared floor in pyproject.toml is >=3.11; this job proves it. The job name
  # is deliberately new so the four required check names on `main` do not change.
  test-python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The `test` extra adds httpx, which fastapi's TestClient needs. The app
      # itself is installed because parsing tests import PyMuPDF/python-docx.
      - run: pip install -e ".[test]"
      - run: python -m pytest

  # Next.js + TypeScript shell (ADR-010). Additive job name, same reason as
  # test-python311: the four required check names on `main` stay stable.
  # `npm ci` needs the committed package-lock.json; the build is the last step
  # so a type or lint failure is reported before paying for a full build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
